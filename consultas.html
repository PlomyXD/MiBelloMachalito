<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultas y preguntas - MI BELLO MACHALITO">
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Consultas y Preguntas - MI BELLO MACHALITO</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h1 class="text-center mb-4 page-title">CONSULTAS Y PREGUNTAS</h1>
                <p class="text-center mb-4 page-subtitle">¿Tienes alguna duda sobre nuestros productos? ¡Estamos aquí para ayudarte! 😺</p>
                
                <form class="inquiry-form" action="mailto:mibellomachalito@gmail.com" method="POST" enctype="text/plain">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto:</label>
                        <input type="text" class="form-control" id="asunto" name="asunto" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Tu consulta o pregunta:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="6" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn button-top w-100 mb-3">Enviar consulta</button>
                </form>

                <div class="text-center">
                    <a href="index.html" class="btn button-bottom">← Volver a la página principal</a>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
